<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Topografia Tatr</title>
<meta name="description" content="Interaktywna mapa i atlas Tatr do nauki topografii na egzamin TOPR.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="blaze r" aria-hidden="true"></span><h1>Topografia Tatr<small>nauka do egzaminu TOPR</small></h1></div>
  <nav class="tabs" aria-label="Sekcje">
    <a href="#gra" data-v="gra">Gra</a>
    <a href="#akcje" data-v="akcje">Akcje TOPR</a>
  </nav>
</header>
<main>
  <section class="view" id="v-mapa">
    <div id="mapwrap">
      <div id="map" aria-label="Mapa Tatr"></div>
      <div class="mapbar">
        <div class="search">
          <input id="q" type="search" placeholder="Szukaj: szczyt, dolina, przełęcz, staw…" autocomplete="off" aria-label="Szukaj na mapie">
          <ul id="qres" hidden></ul>
        </div>
        <button class="chipbtn" id="btnBlind" aria-pressed="false" title="Ukryj nazwy i sprawdź się">Mapa ślepa</button>
        <button class="chipbtn" id="btnLayers" aria-pressed="false">Warstwy</button>
      </div>
      <div id="layers" hidden></div>
    </div>
    <aside id="side"><div class="panel" id="panel"></div></aside>
  </section>

  <section class="view" id="v-gra"><div class="page" id="graPage"></div></section>
  <section class="view" id="v-akcje"><div class="page" id="akcjePage"></div></section>
</main>
<div id="lightbox" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
